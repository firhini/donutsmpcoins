[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false
  framework = "#custom"

# Old Netlify address → custom domain (one canonical host for Google). The API on the old host keeps
# working through the rewrite below, so webhooks/IPNs from older payments still arrive.
[[redirects]]
  from = "https://donutsmpcoins.netlify.app/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "https://donutsmpcoins.netlify.app/*"
  to = "https://donutsmpcoins.shop/:splat"
  status = 301
  force = true

# API: single catch-all function (netlify/functions/api.ts) that routes internally.
# Keep this forced rewrite and do NOT add `config.path` to the function – a custom path
# disables the default /.netlify/functions/api URL this rule targets (→ 404 for every call).
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback – only for known app routes. Public pages are pre-rendered to static
# HTML at build time (scripts/prerender.mjs, flat files like dist/shop/money.html) and
# static files always win over these non-forced rules. Unknown URLs fall through to
# dist/404.html, which Netlify serves with a real 404 status. Keep Netlify's "Pretty
# URLs" post-processing ON (default): it 301s /shop/money/ → /shop/money, matching the
# canonical URLs in the HTML and the sitemap.
[[redirects]]
  from = "/order/*"
  to = "/app.html"
  status = 200

