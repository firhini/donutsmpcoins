[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888
  autoLaunch = false
  framework = "#custom"

# API: single catch-all function (netlify/functions/api.ts) that routes internally.
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA fallback – only for known app routes. Public pages are pre-rendered to static
# HTML at build time (scripts/prerender.mjs) and static files always win. Unknown
# URLs fall through to dist/404.html, which Netlify serves with a real 404 status.
[[redirects]]
  from = "/order/*"
  to = "/index.html"
  status = 200

